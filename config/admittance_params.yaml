# =============================================================================
# Admittance Controller Configuration — Kinova Gen3
# =============================================================================
# Day 22: Force/Torque Sensing Fundamentals
#
# This node talks directly to the Kortex API (not through ros2_kortex driver)
# because the driver doesn't expose wrench data yet.
#
# The controller reads force → converts to position offset → sends new target.
# F_ext / K = displacement. That's the whole idea.
# =============================================================================

admittance_node:
  ros__parameters:

    # --- Kinova Connection ---
    robot_ip: "192.168.1.10"
    username: "admin"
    password: "admin"

    # --- Control Loop ---
    loop_rate_hz: 100             # Hz — how fast the admittance loop runs
                                  # 100Hz is fine for high-level servoing

    # --- Admittance Gains (the K in x_cmd = x_des + F/K) ---
    # Higher K = stiffer (less movement per Newton)
    # Lower K  = more compliant (more movement per Newton)
    # Start HIGH (stiff) and lower gradually!
    stiffness_x: 200.0           # N/m — lateral
    stiffness_y: 200.0           # N/m — lateral
    stiffness_z: 200.0           # N/m — vertical

    # --- Dead Zone ---
    # Forces below this are treated as noise (set to zero)
    # Kinova's torque-based estimation has ~1-2N residual
    dead_zone_force: 1.5         # Newtons
    dead_zone_torque: 0.5        # Nm (not used in v1, but ready for rotation)

    # --- Safety Limits ---
    # Maximum displacement from desired position (meters)
    # The robot will NEVER move further than this, no matter how hard you push
    max_displacement_x: 0.05     # 5cm
    max_displacement_y: 0.05     # 5cm
    max_displacement_z: 0.05     # 5cm

    # Maximum velocity (m/s) — rate-limits sudden jumps
    max_velocity: 0.1            # 10 cm/s

    # --- Filter ---
    # Exponential moving average: 0.0 = no update, 1.0 = no filtering
    # Lower = smoother but laggier, Higher = responsive but noisier
    filter_alpha: 0.1

    # --- Tare ---
    # Number of samples to average when taring (zeroing) the sensor
    tare_samples: 100
    tare_sample_interval_ms: 10  # ms between samples during tare
