# =============================================================================
# Admittance Controller Configuration — Kinova Gen3 + MAE SensuReal F/T Sensor
# =============================================================================
#
# Wrench source: MAE SensuReal via mae_sensor_node (/wrench_raw topic).
# Falls back to Kortex getWrench() if sensor node not running.
# =============================================================================

admittance_node:
  ros__parameters:

    # --- Kinova Connection ---
    robot_ip: "192.168.1.10"
    username: "admin"
    password: "admin"

    # --- Control Loop ---
    loop_rate_hz: 100             # Hz — admittance loop frequency

    # --- Damping Gains (D in v = F/D) ---
    # Units: N·s/m — force needed to produce 1 m/s velocity
    # Higher = stiffer, Lower = more compliant
    # Start HIGH and lower gradually!
    damping_x: 150.0
    damping_y: 150.0
    damping_z: 150.0

    # --- Position Regulation Gain ---
    # Kp in v += Kp*(desired - current)  [1/s]
    # Equilibrium displacement = F / (D × Kp)
    position_gain: 2.0

    # --- Dead Zone ---
    # Forces below this treated as zero
    # MAE SensuReal drift envelope: ~0.1–0.3N
    dead_zone_force: 0.3         # Newtons
    dead_zone_torque: 0.1        # Nm

    # --- Safety Limits ---
    max_displacement_x: 0.05     # 5cm
    max_displacement_y: 0.05     # 5cm
    max_displacement_z: 0.05     # 5cm
    max_velocity: 0.15           # 15 cm/s

    # --- Filter ---
    # EMA: 0.1 = heavy smoothing, 1.0 = no filtering
    filter_alpha: 0.1

    # --- Tare ---
    tare_samples: 100
    tare_sample_interval_ms: 10

    # --- Gravity Model ---
    # Current: test handle (~175g) on F/T sensor flange, no gripper
    # Sequence: robot → flange → F/T sensor → test handle
    # CoG unknown → set to [0,0,0], tare absorbs the residual
    # When Robotiq 2F-85 is installed: mass=0.93, cog_z=0.058
    gripper_mass: 0.175          # kg
    cog_x: 0.0                  # m, in tool frame
    cog_y: 0.0
    cog_z: 0.0

# =============================================================================
# MAE SensuReal F/T Sensor Driver
# =============================================================================
mae_sensor_node:
  ros__parameters:
    sensor_ip: "192.168.1.11"
    sensor_port: 10547
    sampling_period_us: 1000     # 1kHz sensor rate
    publish_rate_hz: 500.0       # Publish every 2nd sample
    auto_bias: true              # Tare on activate
    frame_id: "tool_frame"
